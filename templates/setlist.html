<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday Setlist Builder | Christian LyricsHub</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,400&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .setlist-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 20px 60px;
        }

        /* Top Planner Card */
        .setlist-header-card {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .service-meta-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .service-title-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 12px;
            outline: none;
            width: 100%;
            max-width: 480px;
            font-family: var(--ui-font);
            transition: all 0.2s;
        }

        .service-title-input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.08);
        }

        .service-stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .service-stats-badge span {
            color: #38bdf8;
            font-weight: 700;
        }

        .action-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-present-setlist {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4);
            transition: all 0.2s;
        }

        .btn-present-setlist:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
        }

        .view-mode-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .view-tab {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-tab.active {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Song Search Box */
        .search-add-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-add-input {
            width: 100%;
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 16px 20px 16px 48px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.2s;
        }

        .search-add-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 4px 25px rgba(56, 189, 248, 0.2);
        }

        .search-icon-pos {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.6;
        }

        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            margin-top: 8px;
            max-height: 340px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
        }

        .search-results-dropdown.open {
            display: block;
        }

        .search-result-item {
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-item:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .search-item-title {
            font-weight: 700;
            color: #f8fafc;
            font-size: 0.98rem;
        }

        .search-item-artist {
            font-size: 0.82rem;
            color: #94a3b8;
        }

        /* Setlist Items List */
        .setlist-items-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .setlist-card {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .setlist-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(2px);
        }

        .song-order-col {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-weight: 800;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.92rem;
        }

        .reorder-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn-reorder {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #cbd5e1;
            width: 22px;
            height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-reorder:hover {
            background: #38bdf8;
            color: #000;
        }

        .song-main-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .setlist-song-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .setlist-song-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .song-meta-inputs-col {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .key-badge-selector {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 3px 6px;
            gap: 4px;
        }

        .key-step-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .key-step-btn:hover { background: #38bdf8; color: #000; }

        .key-val {
            font-weight: 800;
            color: #38bdf8;
            min-width: 24px;
            text-align: center;
            font-size: 0.88rem;
        }

        .input-vocalist, .input-note {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
            width: 140px;
        }

        .input-note {
            width: 200px;
        }

        .input-vocalist:focus, .input-note:focus {
            border-color: #38bdf8;
        }

        .song-actions-col {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-card-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-card-action:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .btn-card-action.danger:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* Band Rehearsal Lead Sheet View */
        .rehearsal-lead-sheet {
            display: none;
            flex-direction: column;
            gap: 35px;
        }

        .rehearsal-song-block {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
        }

        .rehearsal-song-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty-setlist-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .setlist-card {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .song-meta-inputs-col {
                width: 100%;
            }
            .input-vocalist, .input-note {
                flex: 1;
                width: auto;
            }
        }
    </style>
</head>
<body class="dark-mode">

    <!-- Navbar -->
    <nav class="navbar" style="position: relative;">
        <a href="index.html" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #4da6ff; text-decoration: none; font-family: var(--ui-font); font-size: 15px; font-weight: bold; display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; z-index: 10;">
            ← Back to Hub
        </a>
        <div class="nav-content">
            <a href="/" class="logo"><span style="color: #ffffff;">Christian</span> LyricsHub</a>
            
            <!-- Theme Toggle Emblem -->
            <div class="header-emblem" id="themeToggle" title="Toggle Light/Dark Mode">
                <div class="sun-icon" id="themeIcon"></div>
            </div>

            <div class="nav-links">
                <a href="bible.html" class="btn-primary" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8;">📖 Bible</a>
                <a href="request.html" class="btn-primary">Request a Song</a>
            </div>
        </div>
    </nav>

    <main class="setlist-container">
        <!-- Service Meta & Action Controls -->
        <header class="setlist-header-card">
            <div class="service-meta-row">
                <input type="text" id="serviceTitleInput" class="service-title-input" value="Sunday Morning Worship" placeholder="Service / Gathering Name">
                <div class="service-stats-badge">
                    <span>🎵 <span id="statSongCount">0</span> Songs</span> • 
                    <span>⏱️ <span id="statEstTime">0</span> mins</span>
                </div>
            </div>

            <div class="action-toolbar">
                <div class="view-mode-tabs">
                    <button class="view-tab active" id="tabSetlistPlanner">📋 Setlist Order</button>
                    <button class="view-tab" id="tabBandRehearsal">🎸 Band Lead Sheet</button>
                </div>

                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button class="btn-present-setlist" id="btnPresentSetlist" title="Project this entire service setlist in Church Presenter View">
                        📺 Present Full Setlist
                    </button>
                    <button class="btn-tool-secondary" id="btnClearSetlist" title="Clear all songs from this setlist">
                        🗑️ Clear
                    </button>
                </div>
            </div>
        </header>

        <!-- Search & Add Song Box -->
        <div class="search-add-box" id="searchAddSection">
            <span class="search-icon-pos">🔍</span>
            <input type="text" class="search-add-input" id="searchAddInput" placeholder="Search 660+ songs to add to Sunday setlist..." autocomplete="off">
            <div class="search-results-dropdown" id="searchResultsDropdown"></div>
        </div>

        <!-- Mode 1: Setlist Order View -->
        <section id="viewPlanner" class="setlist-items-wrapper">
            <div id="setlistList"></div>
        </section>

        <!-- Mode 2: Band Rehearsal Lead Sheet View -->
        <section id="viewRehearsal" class="rehearsal-lead-sheet">
            <div id="rehearsalList"></div>
        </section>
    </main>

    <script src="chords.js"></script>
    <script>
        const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        let setlist = [];
        let librarySongs = [];
        let currentView = 'planner';

        // 1. Load library JSON
        fetch('lyrics_api.json')
            .then(res => res.json())
            .then(data => {
                librarySongs = data;
            })
            .catch(err => console.error("Could not load song catalog", err));

        // 2. Load setlist from localStorage
        function loadSetlist() {
            try {
                const stored = localStorage.getItem('sunday_setlist');
                setlist = stored ? JSON.parse(stored) : [];
            } catch (e) {
                setlist = [];
            }

            // Seed sample setlist if completely empty
            if (setlist.length === 0) {
                setlist = [
                    { id: '10000-reasons.html', title: '10,000 Reasons (Bless the Lord)', artist: 'Matt Redman', key: 'G', leader: 'Worship Leader', notes: 'Opening praise' },
                    { id: 'goodness-of-god-bethel-music.html', title: 'Goodness of God', artist: 'Bethel Music', key: 'G', leader: 'Sarah', notes: 'Repeat chorus x2' },
                    { id: 'amazing-grace.html', title: 'Amazing Grace', artist: 'Hymn', key: 'G', leader: 'Band', notes: 'Acoustic quiet intro' }
                ];
                saveSetlist();
            }

            const title = localStorage.getItem('sunday_setlist_title');
            if (title) document.getElementById('serviceTitleInput').value = title;

            renderSetlist();
            updateStats();
        }

        function saveSetlist() {
            localStorage.setItem('sunday_setlist', JSON.stringify(setlist));
            localStorage.setItem('sunday_setlist_title', document.getElementById('serviceTitleInput').value);
            updateStats();
        }

        function updateStats() {
            document.getElementById('statSongCount').innerText = setlist.length;
            document.getElementById('statEstTime').innerText = setlist.length * 5; // ~5 mins per song
        }

        // 3. Render Setlist Cards
        function renderSetlist() {
            const container = document.getElementById('setlistList');
            container.innerHTML = '';

            if (setlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-setlist-state">
                        <h3>🕊️ Your Sunday Setlist is Empty</h3>
                        <p style="margin-top: 8px;">Use the search bar above to add songs, or browse the Lyrics Archive and click <b>➕ Add to Setlist</b>.</p>
                    </div>
                `;
                return;
            }

            setlist.forEach((song, idx) => {
                const card = document.createElement('div');
                card.className = 'setlist-card';

                card.innerHTML = `
                    <div class="song-order-col">
                        <div class="order-badge">#${idx + 1}</div>
                        <div class="reorder-btns">
                            <button class="btn-reorder" onclick="moveSong(${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>▲</button>
                            <button class="btn-reorder" onclick="moveSong(${idx}, 1)" ${idx === setlist.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>▼</button>
                        </div>
                    </div>

                    <div class="song-main-col">
                        <div class="setlist-song-title">${escapeHtml(song.title)}</div>
                        <div class="setlist-song-artist">${escapeHtml(song.artist)}</div>
                    </div>

                    <div class="song-meta-inputs-col">
                        <div class="key-badge-selector">
                            <button class="key-step-btn" onclick="stepSongKey(${idx}, -1)">♭</button>
                            <span class="key-val" id="key-val-${idx}">${song.key || 'G'}</span>
                            <button class="key-step-btn" onclick="stepSongKey(${idx}, 1)">♯</button>
                        </div>
                        <input type="text" class="input-vocalist" placeholder="Leader (e.g. Sarah)" value="${escapeHtml(song.leader || '')}" onchange="updateSongLeader(${idx}, this.value)">
                        <input type="text" class="input-note" placeholder="Flow / Notes..." value="${escapeHtml(song.notes || '')}" onchange="updateSongNotes(${idx}, this.value)">
                    </div>

                    <div class="song-actions-col">
                        <a href="lyrics-archive/${song.id}" target="_blank" class="btn-card-action" title="Open Song Page">🎸 Chords</a>
                        <button class="btn-card-action danger" onclick="removeSong(${idx})" title="Remove from Setlist">✕</button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 4. Move, Key, Leader, Notes
        function moveSong(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= setlist.length) return;
            const temp = setlist[idx];
            setlist[idx] = setlist[target];
            setlist[target] = temp;
            saveSetlist();
            renderSetlist();
            if (currentView === 'rehearsal') renderRehearsal();
        }

        function stepSongKey(idx, dir) {
            const cur = setlist[idx].key || 'G';
            const curIdx = SHARPS.indexOf(cur);
            let nextIdx = (curIdx + dir) % 12;
            if (nextIdx < 0) nextIdx += 12;
            setlist[idx].key = SHARPS[nextIdx];
            saveSetlist();
            const badge = document.getElementById(`key-val-${idx}`);
            if (badge) badge.innerText = setlist[idx].key;
            if (currentView === 'rehearsal') renderRehearsal();
        }

        function updateSongLeader(idx, val) {
            setlist[idx].leader = val;
            saveSetlist();
        }

        function updateSongNotes(idx, val) {
            setlist[idx].notes = val;
            saveSetlist();
        }

        function removeSong(idx) {
            setlist.splice(idx, 1);
            saveSetlist();
            renderSetlist();
            if (currentView === 'rehearsal') renderRehearsal();
        }

        // 5. Search Bar & Add to Setlist
        const searchInput = document.getElementById('searchAddInput');
        const dropdown = document.getElementById('searchResultsDropdown');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            if (q.length < 2) {
                dropdown.classList.remove('open');
                return;
            }

            const matches = librarySongs.filter(s => 
                s.title.toLowerCase().includes(q) || 
                (s.author && s.author.toLowerCase().includes(q))
            ).slice(0, 10);

            if (matches.length === 0) {
                dropdown.innerHTML = `<div style="padding: 15px; color: #94a3b8; text-align: center;">No matching songs found.</div>`;
            } else {
                dropdown.innerHTML = matches.map(s => `
                    <div class="search-result-item" onclick="addSongFromSearch('${escapeQuote(s.id)}', '${escapeQuote(s.title)}', '${escapeQuote(s.author || 'Worship')}')">
                        <div>
                            <div class="search-item-title">${escapeHtml(s.title)}</div>
                            <div class="search-item-artist">${escapeHtml(s.author || 'Worship')}</div>
                        </div>
                        <button class="btn-card-action">➕ Add</button>
                    </div>
                `).join('');
            }
            dropdown.classList.add('open');
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });

        function addSongFromSearch(id, title, author) {
            setlist.push({
                id: id,
                title: title,
                artist: author,
                key: 'G',
                leader: '',
                notes: ''
            });
            saveSetlist();
            renderSetlist();
            searchInput.value = '';
            dropdown.classList.remove('open');
            if (currentView === 'rehearsal') renderRehearsal();
        }

        // 6. Band Rehearsal Lead Sheet View
        function renderRehearsal() {
            const container = document.getElementById('rehearsalList');
            container.innerHTML = '';

            if (setlist.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Setlist is empty.</p>';
                return;
            }

            setlist.forEach((item, idx) => {
                const block = document.createElement('article');
                block.className = 'rehearsal-song-block';

                const seed = (window.LyricsHubChords && window.LyricsHubChords.SEED_CHORDS[item.id]) 
                    ? window.LyricsHubChords.SEED_CHORDS[item.id] 
                    : null;

                const storedCustom = localStorage.getItem('custom_chords_' + item.id);
                let chordText = "";
                let origKey = "G";

                if (storedCustom) {
                    try {
                        const parsed = JSON.parse(storedCustom);
                        chordText = parsed.text;
                        origKey = parsed.key || "G";
                    } catch (e) {
                        chordText = storedCustom;
                    }
                } else if (seed) {
                    chordText = seed.text;
                    origKey = seed.key;
                }

                // Calculate semitone offset from origKey to item.key
                let offset = 0;
                if (window.LyricsHubChords) {
                    const origIdx = SHARPS.indexOf(origKey);
                    const targetIdx = SHARPS.indexOf(item.key || 'G');
                    if (origIdx !== -1 && targetIdx !== -1) {
                        offset = targetIdx - origIdx;
                    }
                }

                let chordHtml = "";
                if (chordText && window.LyricsHubChords) {
                    chordHtml = window.LyricsHubChords.formatChordProToHtml(chordText, offset);
                } else {
                    const libMatch = librarySongs.find(s => s.id === item.id);
                    const lyrics = libMatch ? libMatch.lyrics : "Lyrics loading...";
                    chordHtml = `<div class="lyric-text" style="white-space: pre-line; line-height: 1.7; font-size: 1.05rem;">${lyrics}</div>`;
                }

                block.innerHTML = `
                    <div class="rehearsal-song-header">
                        <div>
                            <span class="order-badge" style="display:inline-flex; margin-right: 8px;">#${idx + 1}</span>
                            <span style="font-size: 1.4rem; font-weight: 800; color: #f8fafc;">${escapeHtml(item.title)}</span>
                            <span style="color: #94a3b8; font-size: 0.95rem; margin-left: 8px;">by ${escapeHtml(item.artist)}</span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span style="background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 12px; border-radius: 8px; font-weight: 800;">Key: ${item.key || 'G'}</span>
                            ${item.leader ? `<span style="background: rgba(245, 158, 11, 0.15); color: #fbbf24; padding: 4px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;">🎤 ${escapeHtml(item.leader)}</span>` : ''}
                        </div>
                    </div>
                    ${item.notes ? `<div style="background: rgba(255,255,255,0.04); border-left: 3px solid #38bdf8; padding: 8px 14px; margin-bottom: 20px; font-size: 0.88rem; color: #cbd5e1;"><b>Service Flow / Note:</b> ${escapeHtml(item.notes)}</div>` : ''}
                    <div class="chord-chart-container">
                        ${chordHtml}
                    </div>
                `;

                container.appendChild(block);
            });
        }

        // 7. Tabs switching
        document.getElementById('tabSetlistPlanner').addEventListener('click', () => {
            currentView = 'planner';
            document.getElementById('tabSetlistPlanner').classList.add('active');
            document.getElementById('tabBandRehearsal').classList.remove('active');
            document.getElementById('viewPlanner').style.display = 'flex';
            document.getElementById('viewRehearsal').style.display = 'none';
            document.getElementById('searchAddSection').style.display = 'block';
        });

        document.getElementById('tabBandRehearsal').addEventListener('click', () => {
            currentView = 'rehearsal';
            document.getElementById('tabBandRehearsal').classList.add('active');
            document.getElementById('tabSetlistPlanner').classList.remove('active');
            document.getElementById('viewPlanner').style.display = 'none';
            document.getElementById('viewRehearsal').style.display = 'flex';
            document.getElementById('searchAddSection').style.display = 'none';
            renderRehearsal();
        });

        // 8. Present Full Setlist in Church Presenter View
        document.getElementById('btnPresentSetlist').addEventListener('click', () => {
            if (setlist.length === 0) {
                alert("Please add at least one song to your setlist first.");
                return;
            }

            const serviceTitle = document.getElementById('serviceTitleInput').value || "Sunday Worship Service";
            const compiledSlides = [];

            setlist.forEach((item, songIdx) => {
                // Add an elegant song title slide between songs
                compiledSlides.push({
                    tag: `Song ${songIdx + 1} of ${setlist.length}`,
                    text: `${item.title}\nKey: ${item.key || 'G'} ${item.leader ? '• ' + item.leader : ''}`,
                    isTitleSlide: true
                });

                // Find song lyrics
                const libMatch = librarySongs.find(s => s.id === item.id);
                const rawLyrics = libMatch ? libMatch.lyrics : "";
                
                if (rawLyrics) {
                    // Split lyrics into 4-line slides
                    const cleanText = rawLyrics.replace(/<br\s*[\/]?>/gi, '\n').replace(/&nbsp;/g, ' ').trim();
                    const blocks = cleanText.split(/\n\s*\n+/);

                    blocks.forEach((block, bIdx) => {
                        const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lines.length === 0) return;

                        let headerTag = "";
                        const firstLine = lines[0];
                        const tagMatch = firstLine.match(/^(\[.*?\]|Verse\s*\d+|Chorus\s*\d*|Bridge|Pre-Chorus|Outro|Intro|\d+\.)/i);
                        if (tagMatch) {
                            headerTag = tagMatch[1];
                            if (firstLine.trim().toLowerCase() === tagMatch[1].trim().toLowerCase()) {
                                lines.shift();
                            }
                        }

                        const MAX_LINES = 4;
                        for (let i = 0; i < lines.length; i += MAX_LINES) {
                            const chunk = lines.slice(i, i + MAX_LINES);
                            const partNum = Math.floor(i / MAX_LINES) + 1;
                            const subTag = headerTag ? `${item.title} — ${headerTag} (${partNum})` : `${item.title} — Slide ${bIdx + 1}`;
                            compiledSlides.push({
                                tag: subTag,
                                text: chunk.join('\n')
                            });
                        }
                    });
                }
            });

            const payload = {
                title: serviceTitle,
                artist: `${setlist.length} Songs Setlist`,
                slides: compiledSlides,
                startIndex: 0,
                timestamp: Date.now()
            };

            localStorage.setItem('church_presenter_data', JSON.stringify(payload));
            window.open('presenter.html?source=storage&mode=setlist', '_blank');
        });

        // 9. Clear Setlist
        document.getElementById('btnClearSetlist').addEventListener('click', () => {
            if (confirm("Are you sure you want to clear your current setlist?")) {
                setlist = [];
                saveSetlist();
                renderSetlist();
                if (currentView === 'rehearsal') renderRehearsal();
            }
        });

        document.getElementById('serviceTitleInput').addEventListener('input', () => {
            localStorage.setItem('sunday_setlist_title', document.getElementById('serviceTitleInput').value);
        });

        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeQuote(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Theme Toggle (Sync with site-wide Light/Dark preference)
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        if (localStorage.getItem('theme') === 'light') {
            body.classList.replace('dark-mode', 'light-mode');
            if (themeToggle) themeToggle.classList.add('moon-mode');
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                if (body.classList.contains('dark-mode')) {
                    body.classList.replace('dark-mode', 'light-mode');
                    themeToggle.classList.add('moon-mode');
                    localStorage.setItem('theme', 'light');
                } else {
                    body.classList.replace('light-mode', 'dark-mode');
                    themeToggle.classList.remove('moon-mode');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        loadSetlist();
    </script>
</body>
</html>
