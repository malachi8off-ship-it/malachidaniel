<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Song | LyricsHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    
    <nav class="navbar" style="position: relative;">
        <!-- Back Button on Navbar -->
    <a href="index.html" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #4da6ff; text-decoration: none; font-family: var(--ui-font); font-size: 15px; font-weight: bold; display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; z-index: 10; transition: 0.3s;">
        <span style="font-size: 18px; margin-right: 6px;">&larr;</span> Back to Library
    </a>
        <div class="nav-content">
            
            <a href="/" class="logo"><span style="color: #ffffff;">Christian</span> LyricsHub</a>
            <div class="nav-links">
                <button id="darkModeToggle" class="btn-icon" aria-label="Toggle Dark Mode">🌙</button>
            
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2>Request a Song</h2>
            <p>Can't find what you're looking for? Let us know!</p>
            
            <!-- Web3Forms integration -->
            <form action="https://api.web3forms.com/submit" method="POST" class="request-form">
                <!-- Replace with your actual Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
                <input type="hidden" name="subject" value="New Song Request for LyricsHub">
                
                <input type="text" name="song_title" placeholder="Song Title" required>
                <input type="text" name="artist_name" placeholder="Artist Name" required>
                
                <!-- Cloudflare Turnstile Widget -->
                <div class="cf-turnstile-container">
                    <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY"></div>
                </div>
                
                <button type="submit" class="btn-primary">Submit Request</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LyricsHub. Built for music lovers.</p>
    </footer>

    <script>
        const toggle = document.getElementById('darkModeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            toggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
