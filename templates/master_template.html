<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} Lyrics by {{ARTIST}}</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NF3PK5NV');</script>
    <!-- End Google Tag Manager -->
    <meta name="description" content="Read and learn the lyrics to {{TITLE}} by {{ARTIST}} with our clean, ad-free lyrics hub.">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NF3PK5NV"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="logo">
                <span class="logo-text">Christian <span class="accent-text">LyricsHub</span></span>
            </a>
            
            <div class="header-emblem">
                <div class="sun-icon"></div>
            </div>

            <div class="nav-links">
                <a href="request.html" class="btn-primary">Request a Song</a>
                <div class="user-avatar">
                    <img src="../logo.png" alt="Profile" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ccc\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
                </div>
                <button class="btn-icon" aria-label="Notifications">🔔</button>
            </div>
        </div>
    </nav>

    <main class="container">
         <!-- Back Button -->
        <div style="margin: 20px 0; text-align: left;">
            <a href="/" class="btn-back">
                ← Back to Main Hub
            </a>
        </div>
        
        <header class="song-header">
            <h1 class="song-title">{{TITLE}}</h1>
            <h2 class="song-artist">{{ARTIST}}</h2>
            <div class="song-meta">
                <span class="category-badge">{{CATEGORY}}</span>
            </div>
        </header>

        <article class="lyrics-body">
{{LYRICS_CONTENT}}
        </article>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LyricsHub. Built for music lovers.</p>
    </footer>
</body>
</html>
